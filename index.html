<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Editor Video</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--p:#12151d;--b:#232838;--t:#e6e9f2;--m:#8b93a8;--a:#c6ff00;--o:#ff7a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:13px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--b);flex-wrap:wrap}
header b{color:var(--a);margin-right:auto}
button,select,.btn{background:#1b2030;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:7px 10px;font:inherit;cursor:pointer}
button:hover,.btn:hover{border-color:var(--a)}button.pri{background:var(--a);color:#000;border-color:var(--a);font-weight:700}
main{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;padding:8px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.pn{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:8px;min-width:0}
.pn h4{margin:0 0 6px;font-size:10px;letter-spacing:.12em;color:var(--m);text-transform:uppercase}
canvas{max-width:100%;display:block;margin:auto;border-radius:6px;background:#000}
#log{height:150px;overflow:auto;font:11px ui-monospace,monospace;color:#9fe870}
#log div{padding:1px 0;border-bottom:1px dashed #1c2230}#log span{color:var(--m)}
label{display:grid;grid-template-columns:78px 1fr 40px;gap:6px;align-items:center;margin:4px 0;color:var(--m)}
input[type=range]{width:100%;accent-color:var(--o)}input[type=text]{width:100%;background:#0d1018;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:7px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#tw{overflow-x:auto;background:var(--p);border:1px solid var(--b);border-radius:8px;margin:0 8px 8px}
#tl{display:block;border-radius:0;cursor:pointer;touch-action:pan-y}
.bar{display:flex;gap:6px;align-items:center;padding:0 8px 6px;flex-wrap:wrap}
#tc{font:700 14px ui-monospace,monospace;color:var(--a)}
</style></head><body>
<header><b>● STUDIO EDITOR VIDEO</b>
<label class="btn" style="display:block;margin:0">Impor video<input id="f" type="file" accept="video/*" hidden></label>
<select id="fmt"><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option></select>
<button class="pri" id="exp">Ekspor .webm</button></header>
<main>
<section class="pn"><h4>Agents activity</h4><div id="log"></div>
<div class="row"><button id="ag1">Agent: hapus hening</button><button id="ag2">Agent: golden film</button><button id="ag3">Agent: auto-caption</button></div>
<h4 style="margin-top:8px">Caption</h4>
<input type="text" id="ct" placeholder="Tulis teks caption lalu tambah di playhead">
<div class="row"><select id="cs"><option value="0">Bold Pop</option><option value="1">Karaoke</option><option value="2">Minimal</option></select><button id="ca">+ Caption (3 dtk)</button></div></section>
<section class="pn"><h4>Program</h4><canvas id="c"></canvas>
<div class="row" style="justify-content:center"><button id="pl">▶ Putar</button><span id="tc">00:00.0</span></div></section>
<section class="pn"><h4>Waveform · Luma</h4><canvas id="sc" width="300" height="110" style="width:100%"></canvas>
<h4 style="margin-top:8px">Color</h4>
<label>Eksposur<input type="range" id="ex" min="-.5" max=".5" step=".01" value="0"><i></i></label>
<label>Kontras<input type="range" id="kn" min=".5" max="1.6" step=".01" value="1"><i></i></label>
<label>Saturasi<input type="range" id="st" min="0" max="2" step=".01" value="1"><i></i></label>
<label>Temp<input type="range" id="tp" min="-.5" max=".5" step=".01" value="0"><i></i></label>
<label>Tint<input type="range" id="tn" min="-.5" max=".5" step=".01" value="0"><i></i></label>
<label>Vignette<input type="range" id="vg" min="0" max="1" step=".01" value="0"><i></i></label>
<div class="row"><button data-p="gold">Golden Film</button><button data-p="teal">Teal-Orange</button><button data-p="bw">B/W</button><button data-p="0">Reset</button></div></section>
</main>
<div class="bar"><button id="sp">✂ Split (S)</button><button id="dl">Hapus (Del)</button><span style="color:var(--m)">Zoom</span><input type="range" id="zm" min="20" max="200" value="60"></div>
<div id="tw"><canvas id="tl" height="150"></canvas></div>
<script>
const $=i=>document.getElementById(i),c=$('c'),x=c.getContext('2d'),tl=$('tl'),tx=tl.getContext('2d'),sc=$('sc'),sx=sc.getContext('2d');
const v=document.createElement('video');v.playsInline=true;
const tmp=document.createElement('canvas');tmp.width=120;tmp.height=68;const tcx=tmp.getContext('2d',{willReadFrequently:true});
let segs=[],si=0,caps=[],rms=[],sel=null,pps=60,fr=0,ac,dest,hasV=false;
const G={ex:0,kn:1,st:1,tp:0,tn:0,vg:0};
const ST=[{f:'900 {s}px Impact,Arial Black,sans-serif',fill:'#ffe600',st:'#000'},{f:'800 {s}px Arial Black,sans-serif',fill:'#fff',st:'#19d36b'},{f:'600 {s}px system-ui,sans-serif',fill:'#fff',st:'rgba(0,0,0,.6)'}];
function log(m){const d=document.createElement('div');d.innerHTML='<span>'+new Date().toTimeString().slice(0,8)+'</span> '+m;$('log').prepend(d)}
function size(){const[r1,r2]=$('fmt').value.split(':').map(Number);const w=r1>r2?640:r1==r2?480:360;c.width=w;c.height=Math.round(w*r2/r1);c.style.maxHeight='52vh';c.style.width='auto'}
size();$('fmt').onchange=()=>{size();log('Format '+$('fmt').value)};
const dur=()=>segs.reduce((s,g)=>s+g.b-g.a,0),off=i=>segs.slice(0,i).reduce((s,g)=>s+g.b-g.a,0);
const tt=()=>segs.length?off(si)+Math.max(0,v.currentTime-segs[si].a):0;
function seek(t){let o=0;for(let i=0;i<segs.length;i++){const l=segs[i].b-segs[i].a;if(t<=o+l||i==segs.length-1){si=i;v.currentTime=segs[i].a+Math.min(Math.max(t-o,0),l);return}o+=l}}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+(t%60).toFixed(1).padStart(4,'0');
$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;v.src=URL.createObjectURL(f);await new Promise(r=>v.onloadedmetadata=r);
segs=[{a:0,b:v.duration}];si=0;caps=[];sel=null;hasV=true;seek(0);log('Impor: '+f.name+' ('+v.duration.toFixed(1)+' dtk)');
try{ac=ac||new AudioContext();const buf=await ac.decodeAudioData(await f.arrayBuffer());const d=buf.getChannelData(0),w=Math.floor(buf.sampleRate*.05);rms=[];
for(let i=0;i+w<=d.length;i+=w){let s=0;for(let j=0;j<w;j+=8)s+=d[i+j]*d[i+j];rms.push(Math.sqrt(s/(w/8)))}log('Waveform audio dianalisis')}catch(er){rms=[];log('Audio tidak bisa dianalisis')}};
function audioGraph(){if(dest)return;ac=ac||new AudioContext();const s=ac.createMediaElementSource(v);dest=ac.createMediaStreamDestination();s.connect(ac.destination);s.connect(dest)}
function play(){if(!hasV)return;audioGraph();ac.resume();v.paused?v.play():v.pause();$('pl').textContent=v.paused?'▶ Putar':'❚❚ Jeda'}
$('pl').onclick=play;
function split(){const t=tt();let o=0;for(let i=0;i<segs.length;i++){const g=segs[i],l=g.b-g.a;if(t<o+l){const m=g.a+t-o;if(m-g.a>.05&&g.b-m>.05){segs.splice(i,1,{a:g.a,b:m},{a:m,b:g.b});log('Split di '+fmt(t));draw()}return}o+=l}}
function del(){if(sel&&sel.k=='c'){caps.splice(sel.i,1);log('Caption dihapus')}else if(sel&&sel.k=='s'&&segs.length>1){const t=tt();segs.splice(sel.i,1);log('Klip dihapus');seek(Math.min(t,dur()-.01))}sel=null;draw()}
$('sp').onclick=split;$('dl').onclick=del;
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.code=='Space'){e.preventDefault();play()}if(e.key=='s')split();if(e.key=='Delete')del()});
$('ca').onclick=()=>{const t=$('ct').value.trim();if(!t||!hasV)return;const s=tt();caps.push({s,e:Math.min(s+3,dur()),t,st:+$('cs').value});$('ct').value='';log('Caption: '+t);draw()};
$('ag1').onclick=()=>{if(!rms.length)return log('Impor video dengan audio dulu');const th=.02,mg=8;let r=[],st=null,gap=0;
rms.forEach((v2,i)=>{if(v2>th){if(st===null)st=i;gap=0}else if(st!==null){if(++gap>mg){r.push([st,i-gap+1]);st=null;gap=0}}});if(st!==null)r.push([st,rms.length]);
const n=r.map(p=>({a:Math.max(0,p[0]*.05-.05),b:Math.min(v.duration,p[1]*.05+.1)})).filter(g=>g.b-g.a>.2);if(!n.length)return log('Tidak ada bagian bersuara');
const before=dur();segs=n;caps=[];seek(0);log('Hening dihapus: '+before.toFixed(1)+' → '+dur().toFixed(1)+' dtk ('+n.length+' klip)');draw()};
$('ag3').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return log('Pengenalan suara tidak didukung. Buka di Chrome.');if(!hasV)return log('Impor video dulu');
audioGraph();ac.resume();caps=[];seek(0);v.muted=false;v.volume=1;let last=0;const r=new SR();r.lang='id-ID';r.continuous=true;r.interimResults=false;
r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;const t=tt(),w=e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean),n=Math.ceil(w.length/5);if(!n)continue;const sp=Math.max(t-last,n*.8)/n;
for(let k=0;k<n;k++)caps.push({s:last+k*sp,e:last+(k+1)*sp,t:w.slice(k*5,k*5+5).join(' '),st:+$('cs').value});last=t}draw()};
r.onend=()=>{if(!v.paused){try{r.start()}catch(_){}}else log('Auto-caption selesai: '+caps.length+' caption. Edit/hapus jika ada salah.')};
v.play();$('pl').textContent='❚❚ Jeda';r.start();log('Auto-caption: mendengarkan lewat mikrofon. Naikkan volume HP, hindari bising.')};
const P={gold:{ex:.05,kn:1.12,st:1.15,tp:.25,tn:.05,vg:.35},teal:{ex:0,kn:1.15,st:1.25,tp:.12,tn:-.1,vg:.2},bw:{ex:0,kn:1.2,st:0,tp:0,tn:0,vg:.3},0:{ex:0,kn:1,st:1,tp:0,tn:0,vg:0}};
const ids={ex:'ex',kn:'kn',st:'st',tp:'tp',tn:'tn',vg:'vg'};
function setG(o){Object.assign(G,o);for(const k in ids){$(ids[k]).value=G[k];$(ids[k]).nextElementSibling.textContent=(+G[k]).toFixed(2)}}
for(const k in ids)$(ids[k]).oninput=e=>{G[k]=+e.target.value;e.target.nextElementSibling.textContent=G[k].toFixed(2)};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{setG(P[b.dataset.p]);log('Preset grade: '+b.textContent)});
$('ag2').onclick=()=>{setG(P.gold);log('Agent menerapkan LUT Golden Film')};setG(P[0]);
function frame(){const W=c.width,H=c.height;x.fillStyle='#000';x.fillRect(0,0,W,H);
if(hasV&&v.videoWidth){const s=Math.max(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;
x.filter=`brightness(${1+G.ex}) contrast(${G.kn}) saturate(${G.st})`;x.drawImage(v,(W-w)/2,(H-h)/2,w,h);x.filter='none';
x.globalCompositeOperation='soft-light';if(G.tp){x.fillStyle=G.tp>0?`rgba(255,140,0,${G.tp*1.6})`:`rgba(0,120,255,${-G.tp*1.6})`;x.fillRect(0,0,W,H)}
if(G.tn){x.fillStyle=G.tn>0?`rgba(255,0,200,${G.tn*1.6})`:`rgba(0,255,100,${-G.tn*1.6})`;x.fillRect(0,0,W,H)}x.globalCompositeOperation='source-over';
if(G.vg){const g=x.createRadialGradient(W/2,H/2,W*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${G.vg})`);x.fillStyle=g;x.fillRect(0,0,W,H)}
const t=tt();caps.forEach(k=>{if(t>=k.s&&t<=k.e){const S=ST[k.st],fs=Math.round(W*.085);x.font=S.f.replace('{s}',fs);x.textAlign='center';x.lineJoin='round';x.lineWidth=fs*.18;x.strokeStyle=S.st;x.fillStyle=S.fill;
const ws=k.t.split(' ');let ls=[''];ws.forEach(w=>{const L=ls[ls.length-1]+(ls[ls.length-1]?' ':'')+w;if(x.measureText(L).width>W*.88&&ls[ls.length-1])ls.push(w);else ls[ls.length-1]=L});
ls.forEach((L,i)=>{const y=H*.78+(i-(ls.length-1))*fs*1.15;x.strokeText(L,W/2,y);x.fillText(L,W/2,y)})}})}
else{x.fillStyle='#8b93a8';x.font='14px system-ui';x.textAlign='center';x.fillText('Impor video untuk mulai',W/2,H/2)}}
function scope(){sx.fillStyle='rgba(8,10,14,.55)';sx.fillRect(0,0,300,110);if(!hasV)return;tcx.drawImage(c,0,0,120,68);const d=tcx.getImageData(0,0,120,68).data;
sx.fillStyle='rgba(90,255,130,.45)';for(let i=0;i<d.length;i+=4){const p=i/4,px=p%120,L=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];sx.fillRect(px*2.5,110-L/255*108,2,2)}}
function draw(){const W=Math.max(dur()*pps+60,tl.parentElement.clientWidth-2);tl.width=W;const t=tx;t.fillStyle='#0d1018';t.fillRect(0,0,W,150);
t.fillStyle='#8b93a8';t.font='10px monospace';for(let s=0;s*pps<W;s++){t.fillRect(s*pps,0,1,s%5?6:12);if(!(s%5))t.fillText(s+'s',s*pps+3,22)}
let o=0;segs.forEach((g,i)=>{const w=(g.b-g.a)*pps;t.fillStyle='#2a3a5c';t.fillRect(o*pps,28,w-1,40);t.fillStyle='#4f7cff';t.fillRect(o*pps,28,w-1,3);
if(sel&&sel.k=='s'&&sel.i==i){t.strokeStyle='#c6ff00';t.lineWidth=2;t.strokeRect(o*pps+1,29,w-3,38)}
t.fillStyle='#0b2';const i0=Math.floor(g.a/.05),i1=Math.floor(g.b/.05);for(let j=i0;j<i1&&rms.length;j++){const h=Math.min(rms[j]*160,34),px=o*pps+(j*.05-g.a)*pps;t.fillRect(px,108-h/2-4,Math.max(1,pps*.05-.5),Math.max(1,h))}
t.fillStyle='rgba(30,200,60,.12)';t.fillRect(o*pps,72,w-1,40);o+=g.b-g.a});
caps.forEach((k,i)=>{t.fillStyle='#ffe600';t.fillRect(k.s*pps,118,(k.e-k.s)*pps-1,24);t.fillStyle='#000';t.font='11px sans-serif';t.fillText(k.t.slice(0,30),k.s*pps+4,134);
if(sel&&sel.k=='c'&&sel.i==i){t.strokeStyle='#fff';t.lineWidth=2;t.strokeRect(k.s*pps+1,119,(k.e-k.s)*pps-3,22)}});
t.fillStyle='#8b93a8';t.font='9px sans-serif';t.fillText('VIDEO',2,26);t.fillText('AUDIO',2,76);t.fillText('CAPTION',2,116);
const px=tt()*pps;t.fillStyle='#c6ff00';t.fillRect(px,0,2,150);t.fillRect(px-4,0,10,5)}
function pick(e){if(!hasV)return;const r=tl.getBoundingClientRect(),px=(e.clientX-r.left)*(tl.width/r.width),py=(e.clientY-r.top)*(150/r.height),t=px/pps;
sel=null;if(py>=28&&py<70){let o=0;segs.forEach((g,i)=>{const l=g.b-g.a;if(t>=o&&t<o+l)sel={k:'s',i};o+=l})}else if(py>=116){caps.forEach((k,i)=>{if(t>=k.s&&t<=k.e)sel={k:'c',i}})}
seek(Math.min(Math.max(t,0),dur()-.01));draw()}
let dr=false;tl.onpointerdown=e=>{dr=true;pick(e)};tl.onpointermove=e=>{if(dr)pick(e)};addEventListener('pointerup',()=>dr=false);
$('zm').oninput=e=>{pps=+e.target.value;draw()};
function tick(){if(hasV&&!v.paused){const s=segs[si];if(v.currentTime>=s.b-.03){if(si<segs.length-1){si++;v.currentTime=segs[si].a}else{v.pause();$('pl').textContent='▶ Putar';if(window._rec)window._rec.stop()}}}
frame();if(++fr%3==0)scope();$('tc').textContent=fmt(tt())+' / '+fmt(dur());if(hasV&&(!v.paused||fr%10==0))draw();requestAnimationFrame(tick)}
$('exp').onclick=()=>{if(!hasV)return;audioGraph();ac.resume();const st=c.captureStream(30);dest.stream.getAudioTracks().forEach(k=>st.addTrack(k));
const ch=[],r=new MediaRecorder(st,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'});
r.ondataavailable=e=>ch.push(e.data);r.onstop=()=>{window._rec=null;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));a.download='hasil-edit.webm';a.click();log('Ekspor selesai')};
seek(0);v.play();$('pl').textContent='❚❚ Jeda';r.start();window._rec=r;log('Merender secara real-time, tunggu hingga selesai...')};
draw();tick();log('Siap. Impor video untuk memulai.');
</script></body></html>
